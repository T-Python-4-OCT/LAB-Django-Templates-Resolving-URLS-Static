{% extends 'search/base.html' %}
{% load static %}

{% block content %}
<main id="main-content" class="home-page">
    <section class="search-section" aria-label="Google Search">
        <h1 class="google-logo">
            <img src="{% static 'search/images/google-logo.png' %}" alt="Google" width="300" height="102">
        </h1>
        <form action="https://www.google.com/search" method="get" role="search">
            <div class="search-bar">
                <span class="material-icons search-icon" aria-hidden="true">search</span>
                <input type="search" name="q" aria-label="Search Google" autocomplete="off" required>
                <a class="search-tool" href="https://www.google.com/" aria-label="Search by voice on Google">
                    <img src="{% static 'search/images/mircophone.png' %}" alt="" width="24" height="24">
                </a>
                <a class="search-tool" href="https://lens.google/" aria-label="Search by image with Google Lens">
                    <img src="{% static 'search/images/camera.png' %}" alt="" width="24" height="24">
                </a>
            </div>
            <div class="search-buttons">
                <button type="submit">Google Search</button>
                <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
            </div>
        </form>
        <p class="language">Google offered in: <a href="https://www.google.com/?hl=ar" lang="ar" dir="rtl">العربية</a></p>
    </section>
</main>
{% endblock %}
