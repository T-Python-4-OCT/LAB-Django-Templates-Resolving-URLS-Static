{% extends 'main/base.html' %}
{% load static %}

{% block title %}Google{% endblock %}

{% block content %}

<div class="home-container">

    <div class="logo">
        <img src="{% static 'images/google-logo.png' %}" alt="Google">
    </div>

    <form action="https://www.google.com/search" method="get">
        <div class="search-wrapper">
            <span class="search-icon">⌕</span>
            <input type="text" name="q" class="search-box">
            <img src="{% static 'images/mircophone.png' %}" alt="Microphone">
            <img src="{% static 'images/camera.png' %}" alt="Camera">
        </div>

        <div class="search-buttons">
            <button type="submit">Google Search</button>
            <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
        </div>
    </form>

</div>

<footer>
    <a href="{% url 'terms' %}">Terms of Service</a>
</footer>

{% endblock %}
