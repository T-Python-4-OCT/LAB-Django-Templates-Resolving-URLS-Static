{% extends 'search/base.html' %}
{% load static %}
{% block title %}Google{% endblock %}
{% block body_class %}home-page{% endblock %}
{% block content %}
<header class="topbar">
  <nav class="top-links" aria-label="Google links">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://images.google.com/">Images</a>
    <a class="apps-button" href="https://www.google.com/intl/en/about/products" aria-label="Google apps"><span class="material-icons-round">apps</span></a>
    <a class="sign-in" href="https://accounts.google.com/">Sign in</a>
  </nav>
</header>
<main class="home-main">
  <img class="google-logo" src="{% static 'search/images/google-logo.png' %}" alt="Google">
  <form class="search-form" action="https://www.google.com/search" method="get" role="search">
    <label class="search-box">
      <span class="material-icons-round search-icon" aria-hidden="true">search</span>
      <input type="search" name="q" aria-label="Search" autocomplete="off">
      <button class="icon-action" type="button" aria-label="Search by voice"><img src="{% static 'search/images/mircophone.png' %}" alt=""></button>
      <button class="icon-action lens-button" type="button" aria-label="Search by image"><img src="{% static 'search/images/camera.png' %}" alt=""></button>
    </label>
    <div class="search-actions">
      <button type="submit">Google Search</button>
      <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
    </div>
  </form>
  <p class="language">Google offered in: <a href="https://www.google.com/?hl=ar">العربية</a></p>
</main>
<footer class="site-footer">
  <div class="country">Saudi Arabia</div>
  <nav class="footer-links" aria-label="Footer">
    <div class="footer-group"><a href="https://about.google/">About</a><a href="https://ads.google.com/">Advertising</a><a href="https://www.google.com/services/">Business</a><a href="https://www.google.com/search/howsearchworks/">How Search works</a></div>
    <div class="footer-group footer-right"><a href="https://policies.google.com/privacy">Privacy</a><a href="{% url 'terms' %}">Terms</a><a href="https://www.google.com/preferences">Settings</a></div>
  </nav>
</footer>
{% endblock %}
