{% extends 'main/base.html' %}

{% block title %}Google{% endblock %}

{% block content %}
<section class="search-section">
    <h1 class="google-text-logo">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </h1>

    <form action="https://www.google.com/search" method="GET" class="search-form">
        <div class="search-bar">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="text" name="q" class="search-input" required autofocus>
            <span class="material-symbols-outlined action-icon">mic</span>
            <span class="material-symbols-outlined action-icon">photo_camera</span>
        </div>

        <div class="search-buttons">
            <button type="submit" class="btn">Google Search</button>
            <button type="submit" name="btnI" value="I'm Feeling Lucky" class="btn">I'm Feeling Lucky</button>
        </div>
    </form>

    <p class="language-offer">
        Google offered in: <a href="#">العربية</a>
    </p>
</section>
{% endblock %}
