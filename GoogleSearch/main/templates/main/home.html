
{% extends 'main/base.html' %}
{% load static %}

{% block title %}
Google Search
{% endblock %}

{% block content %}

<div class="google-container">

    <div class="home-top-links">
        <a href="https://mail.google.com/">Gmail</a>
        <a href="https://images.google.com/">Images</a>

<a href="https://www.google.com/intl/en/about/products"
   class="apps-link"
   aria-label="Google Apps">
    <span class="material-icons">apps</span>
</a>
        <a href="https://accounts.google.com/" class="sign-in">Sign in</a>
    </div>

    <main class="google-main">

        <img class="google-logo"
             src="{% static 'main/images/google-logo.png' %}"
             alt="Google Logo">

        <form class="search-form"
              action="https://www.google.com/search"
              method="get">

            <div class="search-box">
                <span class="material-icons search-icon">search</span>

                <input type="text"
                       name="q"
                       placeholder="Search Google"
                       required>

                <button type="button" aria-label="Voice Search">
                    <img src="{% static 'main/images/microphone.png' %}"
                         alt="Microphone">
                </button>

                <a href="https://lens.google.com/"
                   aria-label="Google Lens">
                    <img src="{% static 'main/images/camera.png' %}"
                         alt="Camera">
                </a>

            </div>

           <div class="search-buttons">

    <button type="submit">
        Google Search
    </button>

    <button type="submit" name="btnI" value="1">
        I'm Feeling Lucky
    </button>

</div>

<div class="language-links">
    Google offered in:
    <a href="https://www.google.com/?hl=ar">العربية</a>
</div>

        </form>

    </main>

</div>

<footer class="footer">

    <div class="footer-top">
        Saudi Arabia
    </div>

    <div class="footer-bottom">

        <div class="footer-left">
            <a href="https://about.google/">About</a>
            <a href="https://ads.google.com/">Advertising</a>
            <a href="https://www.google.com/business/">Business</a>
            <a href="https://www.google.com/search/howsearchworks/">
                How Search works
            </a>
        </div>

        <div class="footer-right">
            <a href="https://policies.google.com/privacy?hl=en-SA">
                Privacy
            </a>

            <a href="{% url 'terms' %}">
                Terms
            </a>

            <a href="https://www.google.com/preferences?hl=en-SA">
                Settings
            </a>
        </div>

    </div>

</footer>

{% endblock %}
