{% extends 'base.html' %}
{% load static %}

{% block content %}
<main class="home">
  <img src="{% static 'images/google-logo.png' %}" alt="Google" class="logo">

  <!-- Bonus about search -->
  <form action="https://www.google.com/search" method="get">
    <div class="search-box">
        <span class="material-icons">search</span>
        <input type="text" name="q" autofocus>
        <img src="{% static 'images/mircophone.png' %}" alt="Mic" class="icon">
        <img src="{% static 'images/camera.png' %}" alt="Camera" class="icon">
    </div>
    <div class="buttons">
        <button type="submit">Google Search</button>
        <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
    </div>
  </form>

  <p class="offered">Google offered in: <a href="#">العربية</a></p>
</main>
{% endblock %}
