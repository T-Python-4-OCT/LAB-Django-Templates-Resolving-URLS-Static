{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Google{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Static CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Header: the same on all pages -->
    <header class="header">
        <a href="https://mail.google.com" target="_blank">Gmail</a>
        <a href="https://images.google.com" target="_blank">Images</a>
        <span class="material-symbols-outlined apps-icon">apps</span>
        <a href="https://accounts.google.com" target="_blank" class="sign-in">Sign in</a>
    </header>

    {% block content %}
    {% endblock %}

    <!-- Footer: the same on all pages -->
    <footer class="footer">
        <div class="footer-top">Saudi Arabia</div>
        <div class="footer-bottom">
            <div class="footer-links">
                <a href="https://about.google" target="_blank">About</a>
                <a href="https://ads.google.com" target="_blank">Advertising</a>
                <a href="https://www.google.com/services" target="_blank">Business</a>
                <a href="https://www.google.com/search/howsearchworks" target="_blank">How Search works</a>
            </div>
            <div class="footer-links">
                <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
                <!-- dynamic URL to our terms page -->
                <a href="{% url 'main:terms_view' %}">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
