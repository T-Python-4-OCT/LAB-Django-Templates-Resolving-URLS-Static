{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Google{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <header class="top-bar">
    <span class="top-link">Gmail</span>
    <span class="top-link">Images</span>
    <span class="apps-icon material-symbols-outlined" aria-hidden="true">apps</span>
    <span class="sign-in">Sign in</span>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-country">Saudi Arabia</div>
    <div class="footer-links">
      <div class="footer-group">
        <span>About</span>
        <span>Advertising</span>
        <span>Business</span>
        <span>How Search works</span>
      </div>
      <div class="footer-group">
        <span>Privacy</span>
        <a href="{% url 'main:terms' %}">Terms</a>
        <span>Settings</span>
      </div>
    </div>
  </footer>

</body>
</html>
