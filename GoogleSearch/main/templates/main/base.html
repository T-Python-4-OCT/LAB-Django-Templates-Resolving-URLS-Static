{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    <title>{% block title %}Google{% endblock %}</title>
</head>
<body>

    <div class="wrapper">
        <nav>
            <a href="https://mail.google.com/">Gmail</a>
            <a href="https://www.google.com/imghp">Images</a>
            <a href="" class="apps-icon" title="Google apps">
                <span class="material-symbols-outlined">apps</span>
            </a>
            <a href="https://accounts.google.com/" class="btn-sign-in">Sign in</a>
        </nav> <!-- End Nav -->

        <main>
            {% block content %}

            {% endblock %}
        </main>

        {% block footer %}
        <footer>
            <div class="footer-country">Saudi Arabia</div>
            <div class="footer-links">
                <div>
                    <a href="">About</a>
                    <a href="">Advertising</a>
                    <a href="">Business</a>
                    <a href="">How Search works</a>
                </div>
                <div>
                    <a href="">Privacy</a>
                    <a href="{% url 'main:terms_view' %}">Terms</a>
                    <a href="">Settings</a>
                </div>
            </div>
        </footer>
        {% endblock %}

    </div> <!-- End Wrapper -->

</body>
</html>
