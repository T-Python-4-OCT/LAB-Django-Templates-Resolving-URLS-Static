{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Google Search{% endblock %}</title>

   
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

   
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">

</head>
<body>

    {% block content %}
    {% endblock %}
    
<footer class="footer">
    <div class="footer-country">
        Saudi Arabia
    </div>

    <div class="footer-bottom">
        <div class="footer-left">
            <a href="https://about.google/">About</a>
            <a href="https://ads.google.com/">Advertising</a>
            <a href="https://www.google.com/services/">Business</a>
            <a href="https://www.google.com/search/howsearchworks/">
                How Search works
            </a>
        </div>

        <div class="footer-right">
            <a href="https://policies.google.com/privacy">Privacy</a>
            <a href="{% url 'main:terms' %}">Terms</a>
            <a href="#">Settings</a>
        </div>
    </div>
</footer>


</body>
</html>
