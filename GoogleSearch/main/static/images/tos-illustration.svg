      <stop offset="1" stop-color="#6aa8f6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ececee" stop-opacity="0"/>
      <stop offset="1" stop-color="#ececee" stop-opacity="1"/>
