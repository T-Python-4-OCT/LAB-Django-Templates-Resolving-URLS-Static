{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Google{% endblock %}</title>

    <!-- Google Fonts (Roboto) + Google Icons (Material Symbols) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'search/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<header class="top-bar">
    <nav class="top-links">
        <a href="https://mail.google.com">Gmail</a>
        <a href="https://www.google.com/imghp">Images</a>
        <a href="https://about.google/products/" class="apps-btn" aria-label="Google apps">
            <span class="material-symbols-outlined">apps</span>
        </a>
        <a href="https://accounts.google.com/signin" class="sign-in">Sign in</a>
    </nav>
</header>

<main class="content">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-country">Saudi Arabia</div>
    <div class="footer-links">
        <div class="footer-left">
            <a href="https://about.google/">About</a>
            <a href="https://ads.google.com/">Advertising</a>
            <a href="https://www.google.com/services/">Business</a>
            <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
        </div>
        <div class="footer-right">
            <a href="https://policies.google.com/privacy">Privacy</a>
            <a href="{% url 'search:terms' %}">Terms</a>
            <a href="https://www.google.com/preferences">Settings</a>
        </div>
    </div>
</footer>

</body>
</html>
