
{% extends 'search/base.html' %}

{% block title %}Google{% endblock %}

{% block content %}
<div class="home-page">

    <header class="home-header">
        <a href="https://mail.google.com/">Gmail</a>
        <a href="https://images.google.com/">Images</a>
        <span class="material-icons">apps</span>
        <a href="https://accounts.google.com/" class="sign-in">Sign in</a>
    </header>

    <main class="search-container">

        <h1 class="google-logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </h1>

        <form action="https://www.google.com/search" method="GET">
            <div class="search-box">
                <span class="material-icons">search</span>
                <input type="text" name="q" required>
                <span class="material-icons">mic</span>
                <span class="material-icons">photo_camera</span>
            </div>

            <div class="search-buttons">
                <button type="submit">Google Search</button>
                <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
            </div>
        </form>

        <p class="google-language">
            Google offered in:
            <a href="https://www.google.com/?hl=ar">العربية</a>
        </p>

    </main>

    <footer class="home-footer">
        <div class="footer-country">Saudi Arabia</div>

        <div class="footer-bottom">
            <div class="footer-links">
                <a href="https://about.google/">About</a>
                <a href="https://ads.google.com/">Advertising</a>
                <a href="https://www.google.com/services/">Business</a>
                <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
            </div>

            <div class="footer-links">
                <a href="https://policies.google.com/privacy">Privacy</a>
                <a href="{% url 'terms' %}">Terms</a>
                <a href="https://www.google.com/preferences">Settings</a>
            </div>
        </div>
    </footer>

</div>
{% endblock %}
